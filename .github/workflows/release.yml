name: Build Release Zip

# Builds a clean, install-ready adoration-scheduler.zip and attaches it to
# a GitHub Release whenever a version tag is pushed (e.g. `git tag 1.0.1 &&
# git push origin 1.0.1`). Uses `git archive`, which automatically applies
# .gitattributes' export-ignore rules — tests/, .github/, dev tooling, etc.
# never make it into the zip a parish actually downloads and installs.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only unless a workflow explicitly
    # asks for more — softprops/action-gh-release needs contents:write to
    # create the release and generate its notes, or it fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p build/adoration-scheduler
          git archive HEAD | tar -x -C build/adoration-scheduler
          cd build
          zip -r ../adoration-scheduler.zip adoration-scheduler

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: adoration-scheduler.zip
          generate_release_notes: true
